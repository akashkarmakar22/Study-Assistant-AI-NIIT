<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Hall — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Study Hall</span>
      </div>

      <nav class="nav-list">
        <button class="nav-item active" type="button">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M2 3.5h13M2 8.5h13M2 13.5h8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Chat
        </button>
        <button class="nav-item" id="clear-btn" type="button">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M3 5.5h11M6.5 5.5V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.5M4.5 5.5 5 13a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1l.5-7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          New chat
        </button>
      </nav>

      <div class="sidebar-footer">
        <span class="model-dot" aria-hidden="true"></span>
        Powered by Groq · gpt-oss-120b
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h1>Overview</h1>
          <p class="topbar-subtitle">Your study session at a glance</p>
        </div>
        <div class="avatar" aria-hidden="true">S</div>
      </header>

      <section class="stats-row">
        <div class="stat-card stat-card--amber">
          <span class="stat-label">Messages sent</span>
          <span class="stat-value" id="stat-messages">0</span>
        </div>
        <div class="stat-card stat-card--teal">
          <span class="stat-label">Documents summarized</span>
          <span class="stat-value" id="stat-docs">0</span>
        </div>
        <div class="stat-card stat-card--rose">
          <span class="stat-label">Session time</span>
          <span class="stat-value" id="stat-time">0:00</span>
        </div>
      </section>

      <section class="chat-panel">
        <div class="chat-panel-header">
          <h2>Chat</h2>
          <span class="live-dot" aria-hidden="true"></span>
        </div>

        <div id="chat-window" class="chat-window"></div>

        <div id="error-banner" class="error-banner hidden"></div>

        <form id="chat-form" class="composer">
          <input type="file" id="file-input" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp" hidden />
          <button type="button" id="attach-btn" aria-label="Attach file">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.5 6.2 6.8 11a2.1 2.1 0 0 1-3-3l5.4-5.4a3.2 3.2 0 0 1 4.5 4.5l-5.6 5.6a1 1 0 0 1-1.4-1.4l5-5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <input
            id="message-input"
            type="text"
            placeholder="Ask something..."
            autocomplete="off"
            required
          />
          <button type="submit" id="send-btn" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 8h11M8.5 3.5 13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </form>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
