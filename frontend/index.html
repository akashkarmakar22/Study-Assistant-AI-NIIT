<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Study Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>
  <div class="aurora-bg" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <div class="app">
    <div class="mobile-topbar">
      <button id="menu-btn" class="icon-btn" aria-label="Open menu">
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M2.5 5h14M2.5 9.5h14M2.5 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <span class="mobile-title">Study Hall</span>
      <button id="theme-toggle-mobile" class="icon-btn theme-toggle" aria-label="Toggle theme">
        <svg class="icon icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.2V3M8 13v1.8M14.8 8H13M3 8H1.2M12.7 3.3l-1.3 1.3M4.6 11.1l-1.3 1.3M12.7 12.7l-1.3-1.3M4.6 4.9L3.3 3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <svg class="icon icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M13.5 9.7A5.8 5.8 0 1 1 6.3 2.5a4.6 4.6 0 0 0 7.2 7.2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div id="sidebar-backdrop" class="sidebar-backdrop hidden"></div>

    <aside id="sidebar" class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Study Hall</span>
      </div>

      <button id="new-chat-btn" class="new-chat-btn" type="button">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2.5v10M2.5 7.5h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        New chat
      </button>

      <div class="session-list-label">Recent</div>
      <div id="session-list" class="session-list"></div>

      <div class="sidebar-footer">
        <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" type="button">
          <svg class="icon icon-sun" width="15" height="15" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.2V3M8 13v1.8M14.8 8H13M3 8H1.2M12.7 3.3l-1.3 1.3M4.6 11.1l-1.3 1.3M12.7 12.7l-1.3-1.3M4.6 4.9L3.3 3.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <svg class="icon icon-moon" width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M13.5 9.7A5.8 5.8 0 1 1 6.3 2.5a4.6 4.6 0 0 0 7.2 7.2Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span>Theme</span>
        </button>
        <p class="credit">Created by <strong>Akash</strong></p>
      </div>
    </aside>

    <main class="main">
      <div id="chat-area" class="chat-area"></div>

      <div id="error-banner" class="error-banner hidden"></div>

      <form id="chat-form" class="composer">
        <input type="file" id="file-input" accept=".pdf,.docx,.png,.jpg,.jpeg,.webp" hidden />
        <button type="button" id="attach-btn" class="icon-btn" aria-label="Attach file">
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M11.5 6.2 6.8 11a2.1 2.1 0 0 1-3-3l5.4-5.4a3.2 3.2 0 0 1 4.5 4.5l-5.6 5.6a1 1 0 0 1-1.4-1.4l5-5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <input id="message-input" type="text" placeholder="Message Aurora..." autocomplete="off" required />
        <button type="submit" id="send-btn" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8h11M8.5 3.5 13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
